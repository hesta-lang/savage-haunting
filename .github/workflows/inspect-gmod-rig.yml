name: Inspect optimized Femgram 75K rig for Garry's Mod

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID that produced Femgram-Lite-Optimized
        required: true
        default: "41315502143"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect-optimized-rig:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout beta addon tools
        uses: actions/checkout@v4
        with:
          ref: beta/gmod-addon

      - name: Download the approved optimized 75K artifact
        uses: actions/download-artifact@v4
        with:
          name: Femgram-Lite-Optimized
          path: dist/optimized
          repository: hesta-lang/savage-haunting
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Locate optimized FBX
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          FBX="$(find dist/optimized -type f -name 'Femgram-Lite-75K.fbx' -print -quit)"
          test -n "$FBX"
          echo "fbx=$FBX" >> "$GITHUB_OUTPUT"
          echo "Inspecting: $FBX"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libgbm1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          curl -fL --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Inspect optimized 75K FBX armature and weights
        env:
          SOURCE_FBX: ${{ steps.locate.outputs.fbx }}
          REPORT_PATH: ${{ github.workspace }}/dist/femgram-75k-rig-inspection.json
        run: |
          set -euo pipefail
          /tmp/blender-4.4.3-linux-x64/blender --background --python model/inspect_gmod_fbx.py
          test -s dist/femgram-75k-rig-inspection.json

      - name: Upload 75K rig inspection report
        uses: actions/upload-artifact@v4
        with:
          name: Femgram-75K-GMod-Rig-Inspection
          path: dist/femgram-75k-rig-inspection.json
          if-no-files-found: error
          retention-days: 30
