name: Validate Femgram rig topology, skinning and pose deformation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-femgram-rig.yml"
      - "model/validate_femgram_rig.py"
  workflow_dispatch:
    inputs:
      rig_run_id:
        description: Run ID that produced Femgram-75K-ValveBiped-Rigged
        required: true
        default: "41325420322"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/gmod-addon

      - name: Download rigged FBX
        uses: actions/download-artifact@v4
        with:
          name: Femgram-75K-ValveBiped-Rigged
          path: dist/rigged
          repository: hesta-lang/savage-haunting
          run-id: ${{ inputs.rig_run_id || '41325420322' }}
          github-token: ${{ github.token }}

      - name: Locate FBX
        id: rig
        run: |
          set -euo pipefail
          FILE="$(find dist/rigged -name 'Femgram-75K-ValveBiped-Rigged.fbx' -print -quit)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libgbm1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          curl -fL --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Run topology, skinning diagnostics and pose renders
        env:
          RIGGED_FBX: ${{ steps.rig.outputs.file }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/validation
        run: |
          set -euo pipefail
          /tmp/blender-4.4.3-linux-x64/blender --background --python model/validate_femgram_rig.py
          test -s dist/validation/Femgram-Rig-Validation.json
          test -s dist/validation/Femgram-neutral.png
          test -s dist/validation/Femgram-arm-pose.png
          test -s dist/validation/Femgram-leg-pose.png
          python -c 'import json; d=json.load(open("dist/validation/Femgram-Rig-Validation.json")); assert "geometry_diagnostics" in d; assert "regional_skinning_weights" in d["geometry_diagnostics"]; assert "weight_edge_discontinuity" in d["geometry_diagnostics"]'

      - uses: actions/upload-artifact@v4
        with:
          name: Femgram-Rig-Visual-Validation
          path: dist/validation/
          if-no-files-found: error
          retention-days: 30
