name: Inspect and export Femgram Meshy Blend

on:
  workflow_dispatch:
  push:
    paths:
      - "model/source/**"
      - "model/inspect_meshy_blend.py"
      - ".github/workflows/build-model.yml"

jobs:
  inspect-and-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libgles2 libgbm1 python3-pip

      - name: Install NumPy for Blender FBX exporter
        run: |
          PYVER="$(blender --background --factory-startup --python-expr 'import sys; print("BLENDER_PYTHON_VERSION=" + str(sys.version_info.major) + "." + str(sys.version_info.minor))' 2>&1 | sed -n 's/^BLENDER_PYTHON_VERSION=//p' | tail -n 1)"
          if [ -z "$PYVER" ]; then
            echo "Could not detect Blender's Python version"
            exit 1
          fi
          PYTAG="$(echo "$PYVER" | awk -F. '{print "cp" $1 $2}')"
          python3 -m pip install --disable-pip-version-check --target /tmp/blender-python-packages --only-binary=:all: --python-version "$PYVER" --implementation cp --abi "$PYTAG" "numpy==1.26.4"

      - name: Find and inspect uploaded Meshy blend
        run: |
          set -e
          SOURCE="$(find model/source -maxdepth 1 -type f -name '*.blend' -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "No .blend file found in model/source"
            exit 1
          fi
          echo "Using source: $SOURCE"
          mkdir -p dist
          export PYTHONPATH="/tmp/blender-python-packages:${PYTHONPATH:-}"
          blender --background "$SOURCE" --python model/inspect_meshy_blend.py -- --output-dir "$PWD/dist"
          test -s dist/Femgram-Meshy.blend
          test -s dist/Femgram-Meshy.fbx
          test -s dist/Femgram-Meshy-inspection.json
          test -s dist/Femgram-Meshy-summary.txt
          cp "$SOURCE" dist/Femgram-Meshy-original.blend

      - name: Upload Meshy model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Femgram-Meshy-Inspection
          path: dist/
          if-no-files-found: error
          retention-days: 30
