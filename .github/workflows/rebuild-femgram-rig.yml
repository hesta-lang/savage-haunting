name: Rebuild Femgram rig with corrected armature transform

on:
  push:
    branches: [beta/gmod-addon]
    paths:
      - "model/rig_femgram_75k.py"
      - ".github/workflows/rebuild-femgram-rig.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  rebuild-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: beta/gmod-addon

      - name: Download approved 75K source FBX
        uses: actions/download-artifact@v4
        with:
          name: Femgram-75K-Source
          path: dist/source
          repository: hesta-lang/savage-haunting
          run-id: 41332889809
          github-token: ${{ github.token }}

      - name: Locate source FBX
        id: source
        run: |
          set -euo pipefail
          FILE="$(find dist/source -type f -iname '*.fbx' -print -quit)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Install Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libgbm1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          curl -fL --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp

      - name: Generate corrected ValveBiped rig
        env:
          SOURCE_FBX: ${{ steps.source.outputs.file }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/rigged
        run: |
          set -euo pipefail
          /tmp/blender-4.4.3-linux-x64/blender --background --python model/rig_femgram_75k.py
          test -s dist/rigged/Femgram-75K-ValveBiped-Rigged.fbx
          test -s dist/rigged/Femgram-75K-Rig-Report.json

      - name: Validate corrected rig and render joint overlays
        env:
          RIGGED_FBX: ${{ github.workspace }}/dist/rigged/Femgram-75K-ValveBiped-Rigged.fbx
          OUTPUT_DIR: ${{ github.workspace }}/dist/validation
        run: |
          set -euo pipefail
          /tmp/blender-4.4.3-linux-x64/blender --background --python model/validate_femgram_rig.py
          test -s dist/validation/Femgram-Rig-Validation.json
          test -s dist/validation/Femgram-bones-front.png
          test -s dist/validation/Femgram-bones-side.png
          test -s dist/validation/Femgram-leg-pose-front.png

      - name: Upload corrected rigged FBX
        uses: actions/upload-artifact@v4
        with:
          name: Femgram-75K-ValveBiped-Rigged-Corrected
          path: dist/rigged/
          if-no-files-found: error
          retention-days: 30

      - name: Upload corrected visual validation
        uses: actions/upload-artifact@v4
        with:
          name: Femgram-Rig-Visual-Validation-Corrected
          path: dist/validation/
          if-no-files-found: error
          retention-days: 30
