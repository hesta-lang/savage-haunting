name: Femgram - Test knee deformation

on:
  workflow_dispatch:
  push:
    branches:
      - beta/gmod-addon
    paths:
      - 'model/rig_femgram_75k.py'
      - 'model/test_femgram_knee_deformation.py'
      - '.github/workflows/test-femgram-knee-deformation.yml'

permissions:
  actions: read
  contents: read

jobs:
  knee-deformation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: beta/gmod-addon

      - name: Download original 75K source FBX
        uses: actions/download-artifact@v4
        with:
          name: Femgram-75K-ValveBiped-Rigged
          path: dist/source
          repository: hesta-lang/savage-haunting
          run-id: 41332889809
          github-token: ${{ github.token }}

      - name: Locate source FBX
        id: source
        run: |
          set -euo pipefail
          FILE="$(find dist/source -type f -iname '*.fbx' -print -quit)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Install Blender system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libgbm1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0

      - name: Download Blender 4.4.3
        run: |
          curl -fL --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          rm -f /tmp/blender.tar.xz

      - name: Pose knees at 45 and 90 degrees and render
        env:
          SOURCE_FBX: ${{ steps.source.outputs.file }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/knee-deformation
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /tmp/blender-4.4.3-linux-x64/blender --background --python model/test_femgram_knee_deformation.py
          test -s dist/knee-deformation/Femgram-Knee-L-45deg.png
          test -s dist/knee-deformation/Femgram-Knee-L-90deg.png
          test -s dist/knee-deformation/Femgram-Knee-R-45deg.png
          test -s dist/knee-deformation/Femgram-Knee-R-90deg.png
          test -s dist/knee-deformation/Femgram-Knee-Deformation-Report.json

      - name: Upload knee deformation test
        uses: actions/upload-artifact@v4
        with:
          name: Femgram-Knee-Deformation-Test
          path: dist/knee-deformation/
          if-no-files-found: error
          retention-days: 30
